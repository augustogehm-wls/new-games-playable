<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Creature Showcase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ambient background: layered bloom blobs + soft vignette (CSS-only) -->
  <div id="bgFx" aria-hidden="true">
    <span class="bloom bloom-a"></span>
    <span class="bloom bloom-b"></span>
    <span class="bloom bloom-c"></span>
    <div id="vignette"></div>
  </div>

  <!-- ===========================================================
       CREATURE SHOWCASE
       A visual handoff document. Shows one isolated creature that
       loops between a SAD state and a HAPPY (rescued) state.
       Tap the button to toggle. Arrows are placeholders for future
       creatures. See README.md for how the engineer reuses these assets.
       =========================================================== -->

  <main id="stage">

    <!-- =========================================================
         TOP BAR (HUD) — casual-mobile gameplay chrome.
         Left: back + retry. Center: lives (hearts). Right: settings.
         Icon glyphs are pulled from the HomeScreen reference art; the
         lilac chip + shadow come from CSS. Wired in main.js.
         ========================================================= -->
    <header id="hud">
      <div class="hud-side hud-left">
        <button id="backBtn" class="icon-btn" type="button" aria-label="Back">
          <img src="assets/ui/ic_back.png" alt="" draggable="false" />
        </button>
        <button id="retryBtn" class="icon-btn" type="button" aria-label="Retry">
          <img src="assets/ui/ic_retry.png" alt="" draggable="false" />
        </button>
      </div>
      <!-- 3 hearts injected by main.js so they can break/respawn cleanly -->
      <div id="hearts" class="hud-center" aria-label="Lives"></div>
      <div class="hud-side hud-right">
        <button id="settingsBtn" class="asset-btn" type="button" aria-label="Settings">
          <img src="assets/ui/paws_settings.png" alt="" draggable="false" />
        </button>
      </div>
    </header>

    <!-- Level label pill (cosmetic — bump the number in main.js / LEVEL) -->
    <div id="levelPill">Level <span id="levelNum">23</span></div>

    <!-- =========================================================
         PUZZLE AREA — fake scripted puzzle.
         A maze of thick navy arrows surrounds the dragon, who is
         trapped behind a rounded "window" cage. Solving (or tapping
         the hinted arrow) slides the cage open and frees him.
         ========================================================= -->
    <section id="puzzleArea">
      <div id="maze" aria-hidden="true"></div>     <!-- scripted arrows injected by main.js -->
      <div id="fx" aria-hidden="true"></div>        <!-- ambient sparkles + magic bursts -->

      <div id="glow"></div>                         <!-- soft spotlight behind creature -->
      <div id="creatureWrap">
        <img id="creatureImg" alt="trapped creature" draggable="false" />
        <div id="shadow"></div>                     <!-- contact shadow for grounding -->
      </div>

      <!-- The cage: a rounded window in FRONT of the dragon. Slides open on solve. -->
      <div id="bars" aria-hidden="true">
        <span class="bar bar-frame"></span>
        <span class="bar bar-v"></span>
        <span class="bar bar-h"></span>
      </div>

      <!-- Praise word + energy burst, shown on rescue (reused from v1) -->
      <div id="praiseLayer" aria-hidden="true">
        <div id="burst"></div>
        <div id="praiseText"></div>
      </div>

      <!-- Tutorial hand for the hint (asset copied from another playable) -->
      <div id="tutorHand" aria-hidden="true">
        <img src="assets/hands/tutorial_hand.png" alt="" draggable="false" />
      </div>
    </section>

    <!-- =========================================================
         BOTTOM BAR — instruction pill + hint badge, then SOLVE!.
         ========================================================= -->
    <footer id="bottomBar">
      <div id="instruction">
        <span class="paw" aria-hidden="true">&#128062;</span>
        <span id="instructionText">Tap &amp; remove arrows to free the friend!</span>
        <button id="hintBtn" class="hint-badge" type="button" aria-label="Hint">
          <img src="assets/ui/ic_lamp.png" alt="" draggable="false" />
          <span class="hint-count">+1</span>
        </button>
      </div>
      <div id="actionRow">
        <button id="solveBtn" type="button">SOLVE!</button>
        <!-- TEMP test button: costs a heart per tap (3 -> fail). -->
        <button id="wrongBtn" type="button">WRONG MOVE</button>
      </div>
    </footer>
  </main>

  <!-- ===========================================================
       SETTINGS popup — mobile toggles for Music / SFX / Haptics.
       Scale-in + fade. Toggles persist in memory (settings object).
       =========================================================== -->
  <div id="settingsPage" aria-hidden="true">
    <div id="settingsBackdrop"></div>
    <div id="settingsCard">
      <h2 id="settingsTitle">Settings</h2>
      <div class="toggle-row">
        <span>Music</span>
        <button class="switch is-on" type="button" data-key="music" aria-label="Toggle music"><span class="knob"></span></button>
      </div>
      <div class="toggle-row">
        <span>SFX</span>
        <button class="switch is-on" type="button" data-key="sfx" aria-label="Toggle sound effects"><span class="knob"></span></button>
      </div>
      <div class="toggle-row">
        <span>Haptics</span>
        <button class="switch is-on" type="button" data-key="haptics" aria-label="Toggle haptics"><span class="knob"></span></button>
      </div>
      <button id="settingsClose" type="button">Close</button>
    </div>
  </div>

  <!-- ===========================================================
       WIN ENDCARD — second "page", reached via the right arrow.
       A self-contained victory popup (Royal Match / Toon Blast feel):
       darkened blurred gameplay behind, premium card, NICE! headline,
       the rescued dragon, and the install CTA. All animated with CSS.
       =========================================================== -->
  <div id="winPage" aria-hidden="true">
    <!-- dark, blurred backdrop over the paused gameplay (creature stage) -->
    <div id="winBackdrop"></div>

    <!-- the popup card -->
    <div id="winCard">
      <!-- rotating light, clipped inside the card (card has overflow:hidden) -->
      <div id="winRays"></div>
      <!-- big soft glow blobs behind the dragon (populated by main.js) -->
      <div id="winGlowParticles" aria-hidden="true"></div>
      <!-- stars + sparkles emitting behind the dragon (populated by main.js) -->
      <div id="winParticles" aria-hidden="true"></div>

      <div id="winStage">
        <div id="winGlow"></div>   <!-- strong core glow behind the dragon -->
        <img id="winDragon" src="assets/dragon/dragon_happy.png" alt="rescued dragon" draggable="false" />
      </div>

      <!-- CTA with a golden frame around it (like the reference) -->
      <div id="ctaWrap">
        <button id="ctaBtn" type="button">RESCUE MORE FRIENDS!</button>
      </div>
    </div>

    <!-- back to the creature view -->
    <button id="winBack" class="arrow" aria-label="Back to creature">&#10094;</button>
  </div>

  <!-- ===========================================================
       FAIL ENDCARD — reached via the left "FAIL" button.
       A gentle defeat popup: "ALMOST!", the sad dragon waiting for
       help, and a "SAVE THE DRAGON" CTA. Empathetic, not punishing.
       =========================================================== -->
  <div id="failPage" aria-hidden="true">
    <!-- dark, blurred, slightly-blue gameplay behind -->
    <div id="failBackdrop"></div>

    <div id="failCard">
      <!-- soft clouds near the base of the night sky -->
      <div id="failClouds" aria-hidden="true">
        <span class="fail-cloud c1"></span>
        <span class="fail-cloud c2"></span>
        <span class="fail-cloud c3"></span>
      </div>
      <!-- soft night-sky stars (populated by main.js) -->
      <div id="failStars" aria-hidden="true"></div>

      <img id="failHeadline" src="assets/ui/almost.png" alt="ALMOST!" draggable="false" />

      <div id="failStage">
        <div id="failGlow"></div>   <!-- soft glow behind the sad dragon -->
        <img id="failDragon" src="assets/dragon/dragon_sad.png" alt="sad dragon" draggable="false" />
        <!-- thought balloon with a broken heart, near the dragon's head -->
        <div id="failThought">
          <span id="failHeart">&#128148;</span>
          <span class="tdot tdot1"></span>
          <span class="tdot tdot2"></span>
        </div>
      </div>

      <p id="failSubtext">Your friend still needs your help!</p>

      <div id="failCtaWrap">
        <button id="failCtaBtn" type="button">SAVE THE DRAGON</button>
      </div>
    </div>

    <!-- back to the creature view -->
    <button id="failBack" class="arrow" aria-label="Back to creature">&#10094;</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
