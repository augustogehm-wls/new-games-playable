'use strict';

/* ============================================================
   YARN FLOW — Prototype  (mechanic-accurate revision)

   - Picture (top): grid of small colored "dots" forming a design.
     Dots flow downward at constant speed (column-based).
   - Bench (bottom): 3 columns of standing spools (3 / 8 / 3).
     Only the FRONT spool of each column is tappable. Tapping
     pulls back-row spools forward.
   - Conveyor band (middle): horizontal loop, capacity 5 spools
     simultaneously. Spools enter from the LEFT and travel RIGHT;
     when they exit the right side, they wrap back to the left.
     While on the band, each spool continuously checks the
     pattern column directly above it: if the LOWEST remaining
     dot in that column matches its color, the dot is captured —
     it slides down as a yarn line into the spool, the dots above
     all flow down by one cell, and the spool grows another
     yarn-layer (max 7 layers; capacity / 7 dots per layer).
   - When a spool reaches its capacity, it lifts up + shrinks
     into star particles and frees its band slot.
   - Goal: clear the whole picture.
   ============================================================ */

// ============================================================
// SETUP
// ============================================================
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
let W = 0, H = 0, DPR = 1;
let lastFrameMs = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  stage.width  = Math.floor(W * DPR);
  stage.height = Math.floor(H * DPR);
  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutScene();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ============================================================
// TWEEN ENGINE
// ============================================================
const tweens = [];
function tween(target, to, dur, opts) {
  opts = opts || {};
  const from = {};
  for (const k in to) from[k] = target[k];
  const t = {
    target, from, to,
    dur: Math.max(0.0001, dur),
    elapsed: 0,
    delay: opts.delay || 0,
    ease: EASE[opts.ease || 'outQuad'],
    onStep: opts.onStep || null,
    onComplete: opts.onComplete || null,
    keys: Object.keys(to)
  };
  tweens.push(t);
  return t;
}
function killTweensOf(target, keys) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    if (t.target !== target) continue;
    if (!keys) { tweens.splice(i, 1); continue; }
    for (const k of keys) if (t.keys.includes(k)) { tweens.splice(i, 1); break; }
  }
}
const EASE = {
  linear: t => t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutQuad: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1, 3) + c1*Math.pow(t-1, 2); },
  outElastic: t => { const c4 = (2*Math.PI) / 3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4) + 1; },
  outBounce: t => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1/d1) return n1*t*t;
    if (t < 2/d1) return n1*(t -= 1.5/d1)*t + 0.75;
    if (t < 2.5/d1) return n1*(t -= 2.25/d1)*t + 0.9375;
    return n1*(t -= 2.625/d1)*t + 0.984375;
  }
};
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    if (t.delay > 0) { t.delay -= dt; continue; }
    t.elapsed += dt;
    const u = Math.min(1, t.elapsed / t.dur);
    const e = t.ease(u);
    for (const k of t.keys) t.target[k] = t.from[k] + (t.to[k] - t.from[k]) * e;
    if (t.onStep) t.onStep(t.target, e);
    if (u >= 1) {
      tweens.splice(i, 1);
      if (t.onComplete) t.onComplete(t.target);
    }
  }
}

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}
function rgbCss(r, g, b, a) {
  return a === undefined
    ? `rgb(${r|0},${g|0},${b|0})`
    : `rgba(${r|0},${g|0},${b|0},${a})`;
}
function shadeHex(hex, amt) {
  const { r, g, b } = hexToRgb(hex);
  const f1 = amt > 0 ? (255 - r) * amt : -r * amt;
  const f2 = amt > 0 ? (255 - g) * amt : -g * amt;
  const f3 = amt > 0 ? (255 - b) * amt : -b * amt;
  return rgbCss(r + f1, g + f2, b + f3);
}

// ============================================================
// PATTERN BUILD
// ============================================================
function buildPattern() {
  const rows = PATTERN_ROWS;
  const h = rows.length;
  let w = 0;
  for (const r of rows) if (r.length > w) w = r.length;
  // grid[row*w + col] = paletteKey index (0 = empty, 1..N = palette key by appearance order)
  const grid = new Int8Array(w * h);
  const fallY = new Float32Array(w * h);    // continuous y-offset from logical row
  const paletteKeys = [];
  for (let row = 0; row < h; row++) {
    const line = rows[row];
    for (let col = 0; col < w; col++) {
      const ch = col < line.length ? line[col] : '.';
      if (ch === '.') { grid[row*w + col] = 0; continue; }
      const key = PATTERN_COLOR_MAP[ch];
      if (!key) continue;
      let kIdx = paletteKeys.indexOf(key);
      if (kIdx < 0) { paletteKeys.push(key); kIdx = paletteKeys.length - 1; }
      grid[row*w + col] = kIdx + 1;
    }
  }
  return { cols: w, rows: h, grid, fallY, paletteKeys };
}

function countPatternColor(pattern, paletteKey) {
  const idx = pattern.paletteKeys.indexOf(paletteKey);
  if (idx < 0) return 0;
  const want = idx + 1;
  let n = 0;
  for (let i = 0; i < pattern.grid.length; i++) if (pattern.grid[i] === want) n++;
  return n;
}

let spoolIdCounter = 0;
function makeSpool(colorKey, capacity, col) {
  return {
    id: ++spoolIdCounter,
    color: colorKey,
    capOrig: capacity,                      // original capacity (immutable)
    capRem: capacity,                       // dots still to capture (decrements)
    state: 'bench',                         // bench | flying-to-band | on-band | filling-to-die | dying
    benchCol: col,                          // bench column index 0..2
    benchRow: 0,                             // 0 = front; higher = farther back
    x: 0, y: 0,
    targetX: 0, targetY: 0,
    scale: 1,
    rotation: 0,                             // 0 = standing; -PI/2 = lying right
    bandPos: 0,                              // pixel along the band loop (0..bandPerimeter)
    pulse: 0,                                // visual scale jitter on capture
    lastCaptureT: -999,                      // timestamp of last successful capture
    yarnLine: {                              // visible yarn trail from last captured cell to spool
      active: false,
      originX: 0, originY: 0,                // current visible origin (cell side)
      color: null,
      retracting: false,
      retractStartX: 0, retractStartY: 0,
      retractProgress: 0,
      noiseSeed: Math.random() * 1000        // stable jitter pattern
    }
  };
}

function buildBench() {
  // Count remaining color cells in pattern → distribute capacity into spools per
  // BENCH_COLUMN_SIZES (3 / 8 / 3 = 14 spools total).
  const totalSlots = BENCH_COLUMN_SIZES.reduce((a, b) => a + b, 0); // 14
  const colorCells = {};
  for (const k of game.pattern.paletteKeys) colorCells[k] = countPatternColor(game.pattern, k);

  // Allocate spool count per color, proportional to cells (≥1 spool per color)
  const colorSpools = {};
  let leftoverSlots = totalSlots;
  let totalCells = 0;
  for (const k of game.pattern.paletteKeys) totalCells += colorCells[k];
  for (const k of game.pattern.paletteKeys) {
    const want = Math.max(1, Math.round((colorCells[k] / totalCells) * totalSlots));
    colorSpools[k] = want;
    leftoverSlots -= want;
  }
  // Fix overshoot/undershoot by adjusting the largest-cell color
  const orderedColors = game.pattern.paletteKeys.slice().sort((a,b) => colorCells[b] - colorCells[a]);
  let oi = 0;
  while (leftoverSlots !== 0) {
    const k = orderedColors[oi % orderedColors.length];
    if (leftoverSlots > 0) { colorSpools[k]++; leftoverSlots--; }
    else if (colorSpools[k] > 1) { colorSpools[k]--; leftoverSlots++; }
    oi++;
    if (oi > 200) break;
  }
  // For each color, split cells into N spools of roughly equal pieces, grouped per color.
  const byColor = {};                                  // colorKey -> array of capacities
  for (const k of game.pattern.paletteKeys) {
    const cells = colorCells[k];
    const n = colorSpools[k];
    const base = Math.floor(cells / n);
    const extra = cells - base * n;
    byColor[k] = [];
    for (let i = 0; i < n; i++) {
      const cap = base + (i < extra ? 1 : 0);
      if (cap > 0) byColor[k].push(cap);
    }
    // Bigger spools toward the back (front row gets the smallest piece, friendlier to start)
    byColor[k].sort((a, b) => a - b);
  }
  // Shuffle the order in which colors appear at each "round" so layouts vary.
  const colorOrder = game.pattern.paletteKeys.slice();
  for (let i = colorOrder.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = colorOrder[i]; colorOrder[i] = colorOrder[j]; colorOrder[j] = t;
  }

  // Distribute into 3 columns (3 / 8 / 3) — round-robin across colors so the
  // FRONT row of each column ends up with a different color whenever possible.
  const columns = BENCH_COLUMN_SIZES.map(() => ({ spools: [] }));
  // Track the current row we're filling per column. We fill row 0 across all
  // columns first (using colorOrder[0], colorOrder[1], colorOrder[2] when possible),
  // then row 1, etc. — picking the next color that still has stock.
  const remainingSpoolsByColor = () => colorOrder.reduce((sum, k) => sum + byColor[k].length, 0);
  for (let row = 0; row < Math.max(...BENCH_COLUMN_SIZES); row++) {
    let colorCursor = row % colorOrder.length;         // shift so different rows start on different colors
    for (let c = 0; c < BENCH_COLUMN_SIZES.length; c++) {
      if (columns[c].spools.length >= BENCH_COLUMN_SIZES[c]) continue;
      if (remainingSpoolsByColor() === 0) break;
      // Pick a color that has stock AND is different from the same-row colors
      // already placed in the *other* columns of this row (to ensure variety on the front).
      const sameRowColors = columns.map(col => col.spools[row]?.color).filter(Boolean);
      let chosen = null;
      for (let tries = 0; tries < colorOrder.length; tries++) {
        const k = colorOrder[(colorCursor + tries) % colorOrder.length];
        if (!byColor[k].length) continue;
        if (row === 0 && sameRowColors.includes(k) && remainingSpoolsByColor() > BENCH_COLUMN_SIZES.length) {
          // Front row — try harder to pick a unique color
          continue;
        }
        chosen = k; break;
      }
      if (!chosen) {
        // Fallback: any color with stock
        chosen = colorOrder.find(k => byColor[k].length > 0);
      }
      if (!chosen) break;
      const cap = byColor[chosen].shift();             // smallest piece first → front row
      const sp = makeSpool(chosen, cap, c);
      sp.benchRow = columns[c].spools.length;
      columns[c].spools.push(sp);
      colorCursor = (colorCursor + 1) % colorOrder.length;
    }
  }
  game.bench.columns = columns;
}

// ============================================================
// LEVEL INIT
// ============================================================
function buildLevel() {
  game.pattern = buildPattern();
  buildBench();
  game.band.spools = [];
  game.band.full = false;
  game.band.fullFlashT = 0;
  game.particles = [];
  game.phase = 'play';
  layoutScene();
}

// ============================================================
// LAYOUT
// ============================================================
function layoutScene() {
  if (!game.pattern) return;
  const portrait = H >= W;
  const cw = W, ch = H;

  // Allocate height: frame ~52% top, band ~7% middle, bench ~38% bottom, gaps
  const framePadV = portrait ? ch * 0.025 : ch * 0.02;
  const frameMaxH = portrait ? ch * 0.52 : ch * 0.62;
  const frameMaxW = cw * 0.86;

  // cellPx so the pattern fits inside the frame's interior
  const inset = Math.max(14, ch * 0.018);
  const innerPad = 12;
  const availW = frameMaxW - (inset + innerPad) * 2;
  const availH = frameMaxH - (inset + innerPad) * 2;
  const cellByW = availW / game.pattern.cols;
  const cellByH = availH / game.pattern.rows;
  const cellPx = Math.max(8, Math.floor(Math.min(cellByW, cellByH)));
  const drawW = cellPx * game.pattern.cols;
  const drawH = cellPx * game.pattern.rows;
  game.picture.cellPx = cellPx;
  game.picture.padX = inset + innerPad;
  game.picture.padY = inset + innerPad;
  game.picture.w = drawW + (inset + innerPad) * 2;
  game.picture.h = drawH + (inset + innerPad) * 2;
  game.picture.x = (cw - game.picture.w) / 2;
  game.picture.y = framePadV;

  // BAND: directly below frame, full-width strip
  const bandH = Math.max(36, Math.min(46, ch * 0.06));
  game.band.y = game.picture.y + game.picture.h + 6 + bandH / 2;
  game.band.enterX = -80;
  game.band.exitX = cw + 80;
  game.band.height = bandH;

  // Band slot xs (5 evenly spaced positions visible inside the frame width).
  // We use these as "checkpoint columns" — the band continually slides spools
  // through them; they are NOT fixed parking slots.
  const slotN = BAND_CAPACITY;
  const slotInsetX = game.picture.x + 28;
  const slotEndX = game.picture.x + game.picture.w - 28;
  game.picture.slotXs = [];
  for (let i = 0; i < slotN; i++) {
    game.picture.slotXs.push(slotInsetX + (i + 0.5) * (slotEndX - slotInsetX) / slotN);
  }

  // BENCH: 3 columns starting below the band
  const benchTop = game.band.y + bandH * 0.5 + 18;
  const benchBottom = ch - 12;
  const benchH = Math.max(180, benchBottom - benchTop);
  game.benchArea.x = 0; game.benchArea.y = benchTop; game.benchArea.w = cw; game.benchArea.h = benchH;

  // Place 3 bench columns horizontally. The middle column has 8 spools so it
  // extends downward; the outer columns have 3 spools at the top.
  const colSpacing = Math.min(110, cw / 4);
  const colXs = [
    cw / 2 - colSpacing,
    cw / 2,
    cw / 2 + colSpacing
  ];
  // Spool size derived from spacing
  const spoolR = Math.min(34, colSpacing * 0.36);
  const rowSpacing = spoolR * 1.65;          // back-row spools peek above the front

  for (let c = 0; c < game.bench.columns.length; c++) {
    const col = game.bench.columns[c];
    for (let r = 0; r < col.spools.length; r++) {
      const sp = col.spools[r];
      // Front (r=0) sits at the top of the column; back rows peek further down (visually behind).
      sp.targetX = colXs[c];
      sp.targetY = benchTop + spoolR + r * rowSpacing;
      // First-frame snap to target (only if not currently animating)
      if (sp.state === 'bench') { sp.x = sp.targetX; sp.y = sp.targetY; }
      sp._radius = spoolR;
    }
  }

  // Compute band-loop perimeter (we treat it as a 1D loop of width = full screen)
  game.band.perimeter = (game.band.exitX - game.band.enterX);
}

// ============================================================
// INPUT
// ============================================================
function pointerPos(ev) {
  const r = stage.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function onPointerDown(ev) {
  ev.preventDefault();
  const p = pointerPos(ev);
  if (game.phase === 'won') {
    if (ctaHit(p.x, p.y)) launchCTA();
    return;
  }
  // Hit-test the FRONT spool of each bench column
  for (let c = 0; c < game.bench.columns.length; c++) {
    const col = game.bench.columns[c];
    if (!col.spools.length) continue;
    const front = col.spools[0];
    if (front.state !== 'bench') continue;
    const r = front._radius * 1.05;
    const dx = p.x - front.x, dy = p.y - front.y;
    if (dx*dx + dy*dy <= r*r) {
      onTapBenchFront(front, c);
      return;
    }
  }
  if (!tutorial.dismissed) dismissTutorial();
}
stage.addEventListener('pointerdown', onPointerDown, { passive: false });
stage.addEventListener('mousedown',   onPointerDown, { passive: false });

// ============================================================
// GAMEPLAY
// ============================================================
function onTapBenchFront(spool, colIdx) {
  if (game.phase !== 'play') return;
  // If band is full, shake the spool + flash counter red
  if (game.band.spools.length >= BAND_CAPACITY) {
    shakeBenchSpool(spool);
    triggerFullFlash();
    return;
  }
  dismissTutorial();
  // Remove from bench column
  const col = game.bench.columns[colIdx];
  const idx = col.spools.indexOf(spool);
  if (idx >= 0) col.spools.splice(idx, 1);
  // Move remaining spools forward (visual reflow + benchRow update)
  for (let r = 0; r < col.spools.length; r++) {
    const s = col.spools[r];
    s.benchRow = r;
    const dy = (r === 0 ? 0 : (s._radius * 1.65 * r));
    const benchTop = game.benchArea.y + s._radius;
    const newY = benchTop + dy;
    s.targetY = newY;
    killTweensOf(s, ['y']);
    tween(s, { y: newY }, 0.32, { ease: 'outBack' });
  }

  // Animate spool rotating + flying to the band's left entry (then it joins the loop)
  spool.state = 'flying-to-band';
  const bandY = game.band.y;
  const targetEntryX = game.band.enterX + 40;   // arrives just inside the band
  killTweensOf(spool);
  tween(spool, { x: targetEntryX, y: bandY, rotation: -Math.PI / 2 }, 0.42, {
    ease: 'inOutCubic',
    onComplete: () => {
      spool.state = 'on-band';
      spool.bandPos = targetEntryX - game.band.enterX;
      game.band.spools.push(spool);
    }
  });
  tween(spool, { scale: 0.92 }, 0.18, { ease: 'outQuad', onComplete: () => tween(spool, { scale: 1 }, 0.22, { ease: 'outBack' }) });
}

function shakeBenchSpool(spool) {
  killTweensOf(spool, ['x', 'rotation']);
  const orig = spool.targetX;
  let phase = 0;
  const driver = { p: 0 };
  tween(driver, { p: 1 }, 0.32, {
    ease: 'linear',
    onStep: (o) => {
      phase = o.p * 6;
      spool.x = orig + Math.sin(phase * Math.PI) * 6 * (1 - o.p);
    },
    onComplete: () => { spool.x = orig; }
  });
}
function triggerFullFlash() {
  game.band.fullFlashT = 0.6;
}

// === Per-frame band update ==================================
const YARN_RETRACT_TRIGGER = 0.18;       // sec since last capture before retract starts
const YARN_RETRACT_DUR = 0.30;            // sec for the line to shrink into the spool

function updateBand(dt) {
  const peri = game.band.perimeter;
  for (const sp of game.band.spools) {
    if (sp.state !== 'on-band') continue;
    sp.bandPos = (sp.bandPos + BAND_SPEED_PX * dt + peri) % peri;
    sp.x = game.band.enterX + sp.bandPos;
    sp.y = game.band.y;
    sp.rotation = -Math.PI / 2;
    // Continuously try to capture (no artificial cooldown)
    tryCapture(sp);
    // Update yarn-line retraction state
    updateYarnLine(sp, dt);
  }
  game.band.full = game.band.spools.length >= BAND_CAPACITY;
  if (game.band.fullFlashT > 0) game.band.fullFlashT -= dt;
}

function tryCapture(spool) {
  if (game.phase !== 'play') return;
  if (spool.capRem <= 0) return;
  const pat = game.pattern;
  const cs = game.picture.cellPx;
  const x0 = game.picture.x + game.picture.padX;
  const y0 = game.picture.y + game.picture.padY;
  // Pattern column above the spool's current x
  const localX = spool.x - x0;
  const colIdx = Math.floor(localX / cs);
  if (colIdx < 0 || colIdx >= pat.cols) return;
  // Find lowest SETTLED non-empty cell (skip cells still falling)
  let bottomRow = -1;
  for (let row = pat.rows - 1; row >= 0; row--) {
    const idx = row * pat.cols + colIdx;
    if (pat.grid[idx] === 0) continue;
    if (Math.abs(pat.fallY[idx]) > 0.05) continue;     // still in the middle of falling
    bottomRow = row; break;
  }
  if (bottomRow < 0) return;
  const cellVal = pat.grid[bottomRow * pat.cols + colIdx];
  const cellColor = pat.paletteKeys[cellVal - 1];
  if (cellColor !== spool.color) return;
  // Capture: dot disappears immediately, yarn line origin moves to its diagonal corner
  const cellCx = x0 + (colIdx + 0.5) * cs;
  const cellCy = y0 + (bottomRow + 0.5) * cs;
  // Diagonal anchor: bottom corner facing the spool
  const dirSign = (spool.x < cellCx) ? -1 : 1;
  const anchorX = cellCx + dirSign * cs * 0.40;
  const anchorY = cellCy + cs * 0.40;
  // Update yarn line (sequence in progress OR new sequence)
  spool.yarnLine.color = spool.color;
  spool.yarnLine.originX = anchorX;
  spool.yarnLine.originY = anchorY;
  spool.yarnLine.active = true;
  spool.yarnLine.retracting = false;
  spool.yarnLine.retractProgress = 0;
  // Remove dot from grid + start gravity for that column
  pat.grid[bottomRow * pat.cols + colIdx] = 0;
  startColumnGravity(colIdx);
  // Decrement spool, pulse, particles if full
  onSpoolCaptured(spool);
  spool.lastCaptureT = game.totalTime;
}

function updateYarnLine(sp, dt) {
  const yl = sp.yarnLine;
  if (!yl.active) return;
  if (yl.retracting) {
    yl.retractProgress = Math.min(1, yl.retractProgress + dt / YARN_RETRACT_DUR);
    const t = yl.retractProgress;
    yl.originX = yl.retractStartX + (sp.x - yl.retractStartX) * t;
    yl.originY = yl.retractStartY + (sp.y - yl.retractStartY) * t;
    if (t >= 1) {
      yl.active = false;
      yl.retracting = false;
    }
  } else {
    // If the spool hasn't captured anything for a short while, start retracting
    if (game.totalTime - sp.lastCaptureT > YARN_RETRACT_TRIGGER) {
      yl.retracting = true;
      yl.retractStartX = yl.originX;
      yl.retractStartY = yl.originY;
      yl.retractProgress = 0;
    }
  }
}

function startColumnGravity(colIdx) {
  // Convention: rows 0..bottomEmpty are now empty in this column (after the capture).
  // We make every dot above slide down by 1 row at constant speed.
  // Implementation: shift the grid up logically AND set fallY offsets so dots
  // visually appear to start where they were before the shift, then animate
  // fallY down to 0.
  const pat = game.pattern;
  const cs = game.picture.cellPx;
  // Top to bottom, find empty rows and pull dots down
  // We walk from bottom up: for each empty cell in the column, find the closest
  // non-empty cell above it and shift it down (with fallY offset).
  for (let row = pat.rows - 1; row >= 0; row--) {
    const i = row * pat.cols + colIdx;
    if (pat.grid[i] !== 0) continue;
    // Find first non-empty above
    let above = -1;
    for (let r2 = row - 1; r2 >= 0; r2--) {
      if (pat.grid[r2 * pat.cols + colIdx] !== 0) { above = r2; break; }
    }
    if (above < 0) break;     // nothing left above to fall
    // Shift dot at `above` down to `row`
    pat.grid[i] = pat.grid[above * pat.cols + colIdx];
    pat.grid[above * pat.cols + colIdx] = 0;
    // Animate fallY for this dot: starts at -(row-above) cells above its new logical row
    pat.fallY[i] = -(row - above);
    // Animate to 0 at constant speed. Distance = (row-above) cells, time = dist / SPEED.
    const dist = (row - above);
    const dur = dist / PATTERN_FALL_SPEED_CELLS;
    tween({ y: pat.fallY[i], _i: i }, { y: 0 }, dur, {
      ease: 'linear',
      onStep: (o) => { pat.fallY[o._i] = o.y; }
    });
  }
}

function onSpoolCaptured(spool) {
  spool.capRem--;
  spool.pulse = 1;
  tween(spool, { pulse: 0 }, 0.18, { ease: 'outCubic' });
  if (spool.capRem <= 0) {
    onSpoolFull(spool);
  }
}

function onSpoolFull(spool) {
  spool.state = 'dying';
  // Lift up + shrink + emit star particles
  killTweensOf(spool);
  const liftDist = 90;
  tween(spool, { y: spool.y - liftDist, scale: 0.0, rotation: spool.rotation + Math.PI }, 0.55, {
    ease: 'inOutCubic',
    onComplete: () => {
      // Remove from band
      const idx = game.band.spools.indexOf(spool);
      if (idx >= 0) game.band.spools.splice(idx, 1);
    }
  });
  // Star particles burst
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 90 + Math.random() * 130;
    game.particles.push({
      x: spool.x, y: spool.y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 80,
      life: 0.9, age: 0,
      color: '#fff7c2', size: 4 + Math.random() * 3,
      gravity: 240, rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 6
    });
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.age += dt;
    if (p.age >= p.life) { game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.rot += p.vrot * dt;
  }
}

// === WIN ====================================================
function checkWin() {
  if (game.phase !== 'play') return;
  // Win when no dots remain in the pattern AND no spools left to capture
  for (let i = 0; i < game.pattern.grid.length; i++) {
    if (game.pattern.grid[i] !== 0) return;
  }
  // Pattern cleared
  game.phase = 'won';
}

function ctaHit(px, py) {
  if (!game.ctaHitBox) return false;
  return px >= game.ctaHitBox.x && px <= game.ctaHitBox.x + game.ctaHitBox.w
      && py >= game.ctaHitBox.y && py <= game.ctaHitBox.y + game.ctaHitBox.h;
}
function launchCTA() {
  if (window.mraid && window.mraid.open) {
    try { window.mraid.open('https://apps.apple.com/'); } catch (e) {}
  } else {
    window.open('https://apps.apple.com/', '_blank');
  }
}

// ============================================================
// TUTORIAL HELPERS
// ============================================================
function findTutorialSpool() {
  // Pick the front spool of any column whose color has the LOWEST bottom-row
  // dot of matching color (i.e. the spool that would actually capture if tapped).
  // Simpler heuristic: pick the front spool of the largest bench column.
  for (let c = 0; c < game.bench.columns.length; c++) {
    const col = game.bench.columns[c];
    if (col.spools.length && col.spools[0].state === 'bench') return col.spools[0];
  }
  return null;
}
function tutorialUpdateTarget() {
  if (tutorial.dismissed || game.phase !== 'play') return;
  const target = findTutorialSpool();
  if (!target) { tutorial.state = 'idle'; tutorial.target = null; return; }
  tutorial.state = 'pointing';
  tutorial.target = target;
}
function dismissTutorial() {
  if (tutorial.dismissed) return;
  tutorial.dismissed = true;
  killTweensOf(tutorial.hand);
  killTweensOf(tutorial.text);
  tween(tutorial.hand, { alpha: 0, scale: 0 }, 0.18, { ease: 'outCubic' });
  tween(tutorial.text, { alpha: 0 }, 0.18);
}
function updateTutorial(dt) {
  if (tutorial.dismissed || game.phase !== 'play') return;
  tutorial.idleTimer += dt;
  if (tutorial.idleTimer >= tutorial.IDLE_DELAY && tutorial.state === 'idle') {
    tutorialUpdateTarget();
    if (tutorial.target) {
      tween(tutorial.hand, { alpha: 1, scale: 1 }, 0.28, { ease: 'outBack' });
      tween(tutorial.text, { alpha: 1 }, 0.28);
    }
  }
  if (tutorial.target && tutorial.target.state !== 'bench') {
    tutorialUpdateTarget();
  }
  tutorial.tapPhase += dt / tutorial.tapDur;
  if (tutorial.tapPhase >= 1) tutorial.tapPhase -= 1;
  if (tutorial.target) {
    const t = tutorial.target;
    const tapY = Math.sin(tutorial.tapPhase * Math.PI * 2) * -4;
    tutorial.hand.x = t.x + 8;
    tutorial.hand.y = t.y + tapY + 10;
    tutorial.hand.mirror = t.x > W * 0.5;
  }
  tutorial.text.y = game.benchArea.y + Math.min(70, game.benchArea.h * 0.32);
}

// ============================================================
// RENDER
// ============================================================
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, BG.base);
  g.addColorStop(1, BG.shade);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // Vertical "knit rope" stripes
  const stripeW = 18;
  ctx.save();
  for (let x = 0; x < W + stripeW; x += stripeW) {
    const grd = ctx.createLinearGradient(x, 0, x + stripeW, 0);
    grd.addColorStop(0,   BG.weave2);
    grd.addColorStop(0.5, BG.weave1);
    grd.addColorStop(1,   BG.weave2);
    ctx.fillStyle = grd;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(x, 0, stripeW, H);
  }
  ctx.restore();
}

function drawFrame() {
  const p = game.picture;
  // Outer chrome bevel
  ctx.save();
  const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  g.addColorStop(0, CHROME.outerLight);
  g.addColorStop(0.55, CHROME.outerMid);
  g.addColorStop(1, CHROME.outerDark);
  ctx.fillStyle = g;
  roundRectPath(p.x, p.y, p.w, p.h, 22);
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = CHROME.outerDark; ctx.stroke();
  // Inner backdrop (where dots sit)
  ctx.fillStyle = CHROME.innerDark;
  roundRectPath(p.x + 12, p.y + 12, p.w - 24, p.h - 24, 14);
  ctx.fill();
  ctx.restore();
}

function drawPattern() {
  const pat = game.pattern;
  if (!pat) return;
  const cs = game.picture.cellPx;
  const x0 = game.picture.x + game.picture.padX;
  const y0 = game.picture.y + game.picture.padY;
  // Clip to inner backdrop so falling dots don't leak above the frame
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, cs * pat.cols, cs * pat.rows);
  ctx.clip();
  for (let row = 0; row < pat.rows; row++) {
    for (let col = 0; col < pat.cols; col++) {
      const i = row * pat.cols + col;
      const v = pat.grid[i];
      if (v === 0) continue;
      const colorKey = pat.paletteKeys[v - 1];
      const fy = pat.fallY[i] || 0;     // 0 = settled; -X = X cells above logical row
      const cx = x0 + (col + 0.5) * cs;
      const cy = y0 + (row + 0.5 + fy) * cs;
      drawDot(cx, cy, cs * 0.46, colorKey);
    }
  }
  ctx.restore();
}

function drawDot(cx, cy, r, colorKey) {
  const pal = PALETTE[colorKey];
  // Body
  const grd = ctx.createRadialGradient(cx - r*0.35, cy - r*0.40, r*0.1, cx, cy, r);
  grd.addColorStop(0, pal.light);
  grd.addColorStop(0.55, pal.hex);
  grd.addColorStop(1, pal.dark);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  // Specular highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(cx - r*0.35, cy - r*0.42, r*0.32, r*0.18, -Math.PI/3.5, 0, Math.PI*2); ctx.fill();
  // Inner shadow ring
  ctx.strokeStyle = pal.dark;
  ctx.lineWidth = Math.max(1, r * 0.18);
  ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.96, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBand() {
  const cy = game.band.y;
  const bh = game.band.height;
  ctx.save();
  // Shadow under band
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, cy + bh*0.5 - 4, W, 6);
  // Main strip
  const g = ctx.createLinearGradient(0, cy - bh/2, 0, cy + bh/2);
  g.addColorStop(0, BAND_COLORS.base);
  g.addColorStop(1, BAND_COLORS.shade);
  ctx.fillStyle = g;
  ctx.fillRect(0, cy - bh/2, W, bh);
  // Top + bottom rim
  ctx.fillStyle = BAND_COLORS.rim;
  ctx.fillRect(0, cy - bh/2, W, 3);
  ctx.fillRect(0, cy + bh/2 - 3, W, 3);
  // Marching arrows (visualize loop direction → from left to right)
  const step = 60;
  const phase = (game.totalTime * BAND_SPEED_PX) % step;
  ctx.fillStyle = BAND_COLORS.arrow;
  ctx.globalAlpha = 0.65;
  for (let x = -step + phase; x < W + step; x += step) {
    drawArrow(x, cy, bh * 0.42);
  }
  ctx.restore();
}
function drawArrow(cx, cy, sz) {
  ctx.beginPath();
  ctx.moveTo(cx - sz*0.4, cy - sz*0.5);
  ctx.lineTo(cx + sz*0.4, cy);
  ctx.lineTo(cx - sz*0.4, cy + sz*0.5);
  ctx.lineTo(cx - sz*0.1, cy);
  ctx.closePath();
  ctx.fill();
}

function drawSpoolStanding(s) {
  // Pawn / bowling-pin shape: large bulb base, thin neck, smaller top disc with label.
  // Whole body uses the spool's color (with gradient shading).
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(s.scale, s.scale);
  const r = s._radius;
  const pal = PALETTE[s.color];

  // === Ground shadow ===
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(r*0.20, r*1.05, r*1.05, r*0.22, 0, 0, Math.PI*2);
  ctx.fill();

  // === Bottom bulb (the main body) ===
  // Slightly egg-shaped, wider than tall.
  const bulbCY = r * 0.45;
  const bulbW  = r * 1.95;
  const bulbH  = r * 1.55;
  const bulbGrd = ctx.createLinearGradient(0, bulbCY - bulbH/2, 0, bulbCY + bulbH/2);
  bulbGrd.addColorStop(0, pal.light);
  bulbGrd.addColorStop(0.45, pal.hex);
  bulbGrd.addColorStop(1, pal.dark);
  ctx.fillStyle = bulbGrd;
  ctx.beginPath();
  ctx.ellipse(0, bulbCY, bulbW/2, bulbH/2, 0, 0, Math.PI*2);
  ctx.fill();
  // Bulb outline
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = pal.dark;
  ctx.stroke();
  // Specular highlight on bulb
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, bulbCY, bulbW/2 - 2, bulbH/2 - 2, 0, 0, Math.PI*2);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath();
  ctx.ellipse(-bulbW*0.22, bulbCY - bulbH*0.30, bulbW*0.28, bulbH*0.18, -0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // === Neck (short, dark) ===
  const neckW = r * 0.55;
  const neckTop = -r * 0.55;
  const neckBot = -r * 0.20;
  ctx.fillStyle = pal.dark;
  ctx.fillRect(-neckW/2, neckTop, neckW, neckBot - neckTop);
  // Neck side shading
  ctx.fillStyle = pal.hex;
  ctx.globalAlpha = 0.55;
  ctx.fillRect(-neckW/2 + 2, neckTop, neckW * 0.40, neckBot - neckTop);
  ctx.globalAlpha = 1;

  // === Top disc (smaller — bears the number label) ===
  const discW = r * 1.55;
  const discH = r * 0.82;
  const discCY = -r * 0.85;
  const discGrd = ctx.createLinearGradient(0, discCY - discH/2, 0, discCY + discH/2);
  discGrd.addColorStop(0, pal.light);
  discGrd.addColorStop(0.55, pal.hex);
  discGrd.addColorStop(1, pal.dark);
  ctx.fillStyle = discGrd;
  ctx.beginPath();
  ctx.ellipse(0, discCY, discW/2, discH/2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = pal.dark;
  ctx.stroke();
  // Disc inner highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(-discW*0.18, discCY - discH*0.20, discW*0.30, discH*0.22, 0, 0, Math.PI*2);
  ctx.fill();
  // Number label (white text with dark stroke, sitting on the top disc)
  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 4;
  ctx.strokeStyle = pal.dark;
  ctx.strokeText(String(s.capRem), 0, discCY + 1);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(s.capRem), 0, discCY + 1);

  ctx.restore();
}

function drawSpoolLying(s) {
  // Horizontal spool: the yarn body (colored) is the dominant element.
  // Two thin dark end caps sit on either side. Yarn appears as VERTICAL
  // stripes that grow in number/width as the spool captures dots; the
  // currently-filling stripe pulses in scale.
  ctx.save();
  ctx.translate(s.x, s.y);
  const ps = s.scale * (1 + s.pulse * 0.05);
  ctx.scale(ps, ps);
  const r = s._radius;
  const pal = PALETTE[s.color];

  // Total spool width (along x) and height (along y)
  const totalW = r * 2.4;
  const totalH = r * 1.55;
  const capW   = r * 0.30;                                // end-cap width
  const yarnW  = totalW - capW * 2;                       // yarn-area width
  const yarnLeft = -totalW/2 + capW;
  const yarnH  = totalH;

  // === Ground shadow ===
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(0, totalH/2 + 2, totalW/2, r * 0.18, 0, 0, Math.PI*2);
  ctx.fill();

  // === Yarn area background (dark version of color, visible if no layer placed yet) ===
  const baseGrd = ctx.createLinearGradient(0, -yarnH/2, 0, yarnH/2);
  baseGrd.addColorStop(0, pal.dark);
  baseGrd.addColorStop(0.5, shadeHex(pal.hex, -0.35));
  baseGrd.addColorStop(1, pal.dark);
  ctx.fillStyle = baseGrd;
  roundRectPath(yarnLeft, -yarnH/2, yarnW, yarnH, yarnH * 0.18);
  ctx.fill();

  // === Yarn layers (vertical stripes) ===
  const captured = s.capOrig - s.capRem;
  const dotsPerLayer = s.capOrig / SPOOL_LAYER_COUNT;
  const fullLayers = Math.floor(captured / dotsPerLayer);
  const partialFill = (captured / dotsPerLayer) - fullLayers;        // 0..1
  // Each layer is a thin vertical band. Layers are laid left → right
  // (so the yarn "grows" rightward across the spool body as it fills).
  const layerCellW = yarnW / SPOOL_LAYER_COUNT;
  // Clip the layer rendering to the rounded yarn-body rectangle so the
  // pulsing layer doesn't overshoot the silhouette.
  ctx.save();
  ctx.beginPath();
  roundRectPath(yarnLeft, -yarnH/2, yarnW, yarnH, yarnH * 0.18);
  ctx.clip();

  for (let i = 0; i < fullLayers; i++) {
    const lx = yarnLeft + i * layerCellW + layerCellW * 0.5;          // center x
    drawYarnStripe(lx, layerCellW * 0.94, yarnH * 0.96, pal, 1);
  }
  // Partial layer — currently filling (pulses)
  if (fullLayers < SPOOL_LAYER_COUNT && partialFill > 0) {
    const i = fullLayers;
    const lx = yarnLeft + i * layerCellW + layerCellW * 0.5;
    // Width grows with fill; pulse adds a subtle wobble (recent-capture pulse uses s.pulse)
    const wobble = 1 + s.pulse * 0.20 + 0.05 * Math.sin(game.totalTime * 7);
    const w = layerCellW * (0.30 + 0.64 * partialFill) * wobble;
    const h = yarnH * (0.96 + s.pulse * 0.12);
    drawYarnStripe(lx, w, h, pal, 1);
  }
  ctx.restore();

  // === End caps (thin dark vertical disks at extremes) ===
  for (const sgn of [-1, 1]) {
    const cx = sgn * (totalW/2 - capW/2);
    // Outer black ring
    ctx.fillStyle = '#15171f';
    ctx.beginPath();
    ctx.ellipse(cx, 0, capW * 0.55, totalH * 0.55, 0, 0, Math.PI*2);
    ctx.fill();
    // Inner gray disk
    ctx.fillStyle = '#3a3e48';
    ctx.beginPath();
    ctx.ellipse(cx, 0, capW * 0.40, totalH * 0.45, 0, 0, Math.PI*2);
    ctx.fill();
    // Tiny axis dot
    ctx.fillStyle = '#13141a';
    ctx.beginPath();
    ctx.ellipse(cx, 0, capW * 0.16, totalH * 0.18, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // === Number label above the spool ===
  drawSpoolLabel(0, -totalH * 0.95, s.capRem);
  ctx.restore();
}

// Draws one vertical yarn stripe centered at (cx, 0), of width `w` and height `h`.
function drawYarnStripe(cx, w, h, pal, alpha) {
  // Rounded vertical bar with cylinder-style horizontal shading
  const lx = cx - w/2;
  const grd = ctx.createLinearGradient(lx, 0, lx + w, 0);
  grd.addColorStop(0, pal.dark);
  grd.addColorStop(0.5, pal.light);
  grd.addColorStop(1, pal.dark);
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = grd;
  roundRectPath(lx, -h/2, w, h, Math.min(w, h) * 0.35);
  ctx.fill();
  // Subtle inner highlight (the strand-around-strand look)
  ctx.fillStyle = pal.hex;
  ctx.globalAlpha = (alpha || 1) * 0.40;
  roundRectPath(lx + w*0.32, -h*0.42, w*0.18, h*0.84, w*0.10);
  ctx.fill();
  ctx.restore();
}

function drawSpoolLabel(cx, cy, n) {
  ctx.save();
  ctx.fillStyle = 'rgba(8,10,18,0.92)';
  const w = 28, h = 18;
  roundRectPath(cx - w/2, cy - h/2, w, h, 9);
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), cx, cy + 0.5);
  ctx.restore();
}

function drawBenchSpools() {
  // Draw back-to-front (back rows behind front)
  for (let c = 0; c < game.bench.columns.length; c++) {
    const col = game.bench.columns[c];
    for (let r = col.spools.length - 1; r >= 0; r--) {
      const sp = col.spools[r];
      if (sp.state === 'bench' || sp.state === 'flying-to-band') {
        if (Math.abs(sp.rotation) > 0.05) {
          drawSpoolLying(sp);
        } else {
          drawSpoolStanding(sp);
        }
      }
    }
  }
}
function drawBandSpools() {
  for (const sp of game.band.spools) {
    if (sp.state === 'on-band' || sp.state === 'dying') {
      drawSpoolLying(sp);
    }
  }
}

function drawYarnLines() {
  // For each spool with an active yarn line, draw an IRREGULAR yarn strand
  // from the line's origin (the diagonal corner of the last captured dot,
  // which slides toward the spool while retracting) to the spool position.
  for (const sp of game.band.spools) {
    const yl = sp.yarnLine;
    if (!yl.active) continue;
    const pal = PALETTE[yl.color];
    drawIrregularYarn(yl.originX, yl.originY, sp.x, sp.y - sp._radius * 0.20, pal, yl.noiseSeed);
  }
}

// Draws a yarn strand from (x1,y1) to (x2,y2) with small irregular kinks.
// The kinks are deterministic per-seed so the line doesn't visibly jitter
// every frame (only its endpoints move).
function drawIrregularYarn(x1, y1, x2, y2, pal, seed) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  if (dist < 4) return;
  const ux = dx / dist, uy = dy / dist;          // unit forward
  const nx = -uy, ny = ux;                        // unit perpendicular
  const segs = Math.max(5, Math.min(14, Math.floor(dist / 22)));
  const ampMax = Math.min(7, dist * 0.05);
  // Build the wavy path
  const pts = [{ x: x1, y: y1 }];
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const baseX = x1 + dx * t;
    const baseY = y1 + dy * t;
    // Two superposed sines + a deterministic per-segment kink
    const k1 = Math.sin(t * Math.PI * 4 + seed * 0.013) * ampMax * 0.65;
    const k2 = Math.sin(t * Math.PI * 7.7 + seed * 0.029) * ampMax * 0.35;
    // Taper the wave so endpoints stay anchored
    const taper = Math.sin(t * Math.PI);
    const k = (k1 + k2) * taper;
    pts.push({ x: baseX + nx * k, y: baseY + ny * k });
  }
  pts.push({ x: x2, y: y2 });

  ctx.save();
  // Soft outer "glow" for fluffy yarn look
  ctx.strokeStyle = pal.dark;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  // Main color stroke
  ctx.strokeStyle = pal.hex;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  // Highlight thread
  ctx.strokeStyle = pal.light;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  const used = game.band.spools.length;
  const label = `${used}/${BAND_CAPACITY}`;
  const cx = W / 2;
  const pillW = 78, pillH = 30;
  const pillY = game.band.y + game.band.height/2 + 22;
  ctx.save();
  // Red flash if "full" event was triggered
  let bg = 'rgba(20, 22, 36, 0.92)';
  let border = '#cfe0ff';
  let textColor = '#fff';
  if (game.band.fullFlashT > 0) {
    const blink = Math.sin(game.totalTime * 18) > 0;
    if (blink) {
      bg = 'rgba(180,30,30,0.95)';
      border = '#ffb3b3';
      textColor = '#fff';
    }
  }
  ctx.fillStyle = bg;
  roundRectPath(cx - pillW/2, pillY - pillH/2, pillW, pillH, 16);
  ctx.fill();
  ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = textColor;
  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, pillY);
  ctx.restore();
}

function drawTutorial() {
  if (tutorial.dismissed || game.phase !== 'play') return;
  if (tutorial.hand.alpha <= 0 && tutorial.text.alpha <= 0) return;
  if (handImgReady && tutorial.hand.alpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = tutorial.hand.alpha;
    const sz = 96 * tutorial.hand.scale;
    ctx.translate(tutorial.hand.x, tutorial.hand.y);
    if (tutorial.hand.mirror) ctx.scale(-1, 1);
    ctx.drawImage(handImg, 0, 0, sz, sz);
    ctx.restore();
  }
  if (tutorial.text.alpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = tutorial.text.alpha;
    ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(20,22,36,0.92)';
    ctx.fillStyle = '#fff';
    const txt = 'Tap to collect the yarn';
    const tx = W / 2;
    const ty = tutorial.text.y;
    ctx.strokeText(txt, tx, ty);
    ctx.fillText(txt, tx, ty);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of game.particles) {
    const lifeT = 1 - p.age / p.life;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = lifeT;
    ctx.fillStyle = p.color;
    // 4-point star
    const r1 = p.size, r2 = p.size * 0.42;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI / 4;
      const r = (i % 2 === 0) ? r1 : r2;
      const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawCTA() {
  if (game.phase !== 'won') { game.ctaHitBox = null; return; }
  const btnW = Math.min(W * 0.72, 320);
  const btnH = 64;
  const cx = W / 2;
  const cy = H * 0.5;
  ctx.save();
  ctx.fillStyle = 'rgba(8, 10, 22, 0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = 'bold 32px -apple-system, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText('You did it!', cx, cy - 80);
  ctx.font = '18px -apple-system, sans-serif';
  ctx.fillStyle = '#d8dbe2';
  ctx.fillText('Picture cleared', cx, cy - 46);
  const bx = cx - btnW/2, by = cy - btnH/2;
  const grd = ctx.createLinearGradient(0, by, 0, by + btnH);
  grd.addColorStop(0, '#34d27a');
  grd.addColorStop(1, '#149948');
  ctx.fillStyle = grd;
  roundRectPath(bx, by, btnW, btnH, 18);
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#0a3b1d'; ctx.stroke();
  const pulse = 0.5 + 0.5 * Math.sin(game.totalTime * 4);
  ctx.fillStyle = `rgba(255,255,255,${0.18 * pulse})`;
  roundRectPath(bx + 4, by + 4, btnW - 8, btnH/2, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('Install Now', cx, by + btnH/2);
  ctx.restore();
  game.ctaHitBox = { x: bx, y: by, w: btnW, h: btnH };
}

function roundRectPath(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ============================================================
// MAIN LOOP
// ============================================================
function frame(now) {
  const dt = lastFrameMs ? Math.min(0.05, (now - lastFrameMs) / 1000) : 0;
  lastFrameMs = now;
  game.totalTime += dt;

  if (game.phase === 'play') {
    updateTutorial(dt);
    updateBand(dt);
    updateParticles(dt);
    checkWin();
  } else {
    updateParticles(dt);
  }
  updateTweens(dt);

  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawFrame();
  drawPattern();
  drawBand();
  drawBandSpools();
  drawYarnLines();
  drawBenchSpools();
  drawHUD();
  drawTutorial();
  drawParticles();
  drawCTA();
  requestAnimationFrame(frame);
}

// ============================================================
// INIT
// ============================================================
resize();
buildLevel();
requestAnimationFrame(frame);

})();
</script>
